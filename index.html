<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:Arial,sans-serif;color:#172033}

function norm(s){
 return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/đ/g,"d").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
const stop=new Set(["la","gi","co","khong","duoc","the","nao","thi","va","hay","cho","toi","em","hoc","sinh","trong","cua","mot","nhung","voi","neu","phai","khi","o","den","theo","ve","noi","quy","truong"]);

function tokens(s){return norm(s).split(" ").filter(x=>x.length>1&&!stop.has(x))}
function score(q,r){
 const qt=tokens(q), rt=tokens(r[3]), qn=norm(q), rn=norm(r[2]);
 let hit=0;
 for(const w of qt) if(rt.includes(w)) hit+=1+(w.length>=6?.7:0);
 // exact phrases/topics receive a boost
 const phrases=["dien thoai","dong phuc","nghi hoc","ban tru","nha ve sinh","danh nhau","ruou bia","thuoc la","mang thai","băng vệ sinh"];
 for(const p of phrases) if(qn.includes(norm(p))&&rn.includes(norm(p))) hit+=3;
 return hit/(Math.sqrt(qt.length||1));
}

function getAnswer(q){
 const nq=norm(q);
 if(!nq)return "Bạn hãy nhập câu hỏi nhé.";
 if(/^(xin chao|hello|chao)/.test(nq))return {text:"Xin chào! 👋 Mình có thể trả lời các câu hỏi dựa trên nội quy học sinh, bán trú và nhà vệ sinh mà bạn đã cung cấp.",src:""};
 let arr=KB.map((r,i)=>({r,i,s:score(q,r)})).sort((a,b)=>b.s-a.s);
 // Return several related rules when the question is broad.
 const top=arr[0];
 if(top.s<0.55){
   if(nq.includes("noi quy")) return {text:"Tài liệu có 3 nhóm nội dung chính: nội quy học sinh (42 mục), nội quy học sinh bán trú và nội quy sử dụng nhà vệ sinh nam/nữ. Bạn hãy hỏi cụ thể vấn đề muốn tra cứu.",src:""};
   return {text:"Mình chưa xác định được quy định phù hợp trong tài liệu. Bạn có thể hỏi cụ thể hơn, ví dụ: “Có được dùng điện thoại không?”, “Nghỉ học phải làm gì?”, “Bán trú có được ra ngoài không?”",src:""};
 }
 const related=arr.filter(x=>x.s>=Math.max(top.s*.78,.72)).slice(0,5);
 let text=related.map((x,i)=>`${i+1}. ${x.r[2]}`).join("\n");
 let src=related.map(x=>`${x.r[0]} – ${x.r[1]}`).join("; ");
 return {text,src};
}
function add(text,who,src=""){
 const row=document.createElement("div");row.className="msg "+who;
 const b=document.createElement("div");b.className="bubble";b.textContent=text;
 if(src){const s=document.createElement("div");s.className="sources";s.textContent="Nguồn: "+src;b.appendChild(s)}
 row.appendChild(b);document.getElementById("chat").appendChild(row);
 document.getElementById("chat").scrollTop=999999;
}
function ask(q){add(q,"user");setTimeout(()=>{let a=getAnswer(q);add(a.text,"bot",a.src)},100)}
function send(){const i=document.getElementById("q");const q=i.value.trim();if(q){i.value="";ask(q)}}
